# Qwen3.5-4B CUAD LoRA SFT configuration for one NVIDIA L40S.
# Build data first:
#   python finetuning/cuad_sft_data.py
# Train:
#   python finetuning/train_cuad_sft.py --config finetuning/sft_config.yaml

model:
  id: Qwen/Qwen3.5-4B

data:
  dir: finetuning/artifacts/cuad-sft

output:
  dir: finetuning/artifacts/cuad-sft-run

training:
  max_seq_length: 32768
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 0.0001
  warmup_ratio: 0.03
  weight_decay: 0.0
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05
  seed: 42
  logging_steps: 1
  save_total_limit: 3
  qlora: false
  gradient_checkpointing: true
  flash_attention: true
