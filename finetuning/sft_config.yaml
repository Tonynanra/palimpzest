# Qwen3.8-27B-FP8 CUAD BF16 LoRA SFT configuration for one NVIDIA GH200.
# Build data first:
#   python finetuning/cuad_sft_data.py
# Train:
#   python finetuning/train_cuad_sft.py --config finetuning/sft_config.yaml

model:
  id: Qwen/Qwen3.8-27B-FP8

data:
  dir: finetuning/artifacts/cuad-sft

training:
  max_seq_length: 36864
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 0.0001
  warmup_ratio: 0.03
  weight_decay: 0.0
  lora_rank: 32
  lora_alpha: 64
  # Float8 activations do not support PyTorch dropout in native PEFT.
  lora_dropout: 0.0
  seed: 42
  logging_steps: 1
  save_total_limit: 3
  qlora: false
  gradient_checkpointing: true
  flash_attention: true
